apiVersion: v1
kind: Service
metadata:
  name: vm-proxy
  namespace: mesh-services
  labels:
    app: vm-proxy
spec:
  ports:
  - name: http
    port: 80
    # With Istio sidecar on the VM, targetPort must be the real application port.
    # Use 80 for Nginx, 8080 for JBoss/WildFly, or your app port.
    targetPort: 80
  selector:
    app: vm-proxy
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: vm-proxy-dr
  namespace: mesh-services
spec:
  host: vm-proxy.mesh-services.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL