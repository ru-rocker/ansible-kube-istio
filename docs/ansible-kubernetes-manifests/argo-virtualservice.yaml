apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: argo-virtualservice
  namespace: "{{ argo_namespace }}"
spec:
  hosts:
    - "{{ argo_cd_server_host }}"
  gateways:
    - argo-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: argocd-server
            port:
              number: 80
