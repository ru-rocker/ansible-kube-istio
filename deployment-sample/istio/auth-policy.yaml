apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: payment-service-policy
  namespace: mesh-services
spec:
  selector:
    matchLabels:
      app: payment-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/mesh-services/sa/default"
    to:
    - operation:
        ports: ["80"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: order-service-policy
  namespace: mesh-services
spec:
  selector:
    matchLabels:
      app: order-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/mesh-services/sa/default"
        - "cluster.local/ns/mesh-services/sa/vm-proxy-sa"
        - "cluster.local/ns/meshz-services/sa/default"
    to:
    - operation:
        ports: ["80"]
---
# Note: Since the VM connects to the control plane through a NAT gateway,
# istiod cannot resolve workload labels (like app: vm-proxy) on its connection.
# Therefore, we omit the selector field so that this ALLOW policy applies
# to all workloads in the namespace, including the VM proxy.
#
# Two rules are needed:
#   Rule 1 - Allows mTLS-authenticated traffic from known principals (standard mesh traffic).
#   Rule 2 - Allows unauthenticated (plaintext) traffic on port 80. This is required because
#            the Waypoint→VM hop is plaintext when the VM is on a public IP (no HBONE tunnel).
#            The VM sidecar operates in PERMISSIVE mTLS mode to accept this traffic.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: vm-proxy-policy
  namespace: mesh-services
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/mesh-services/sa/default"
        - "cluster.local/ns/meshz-services/sa/default"
        - "cluster.local/ns/mesh-services/sa/waypoint"
    to:
    - operation:
        ports: ["80"]
  - to:
    - operation:
        ports: ["80"]