apiVersion: v1
kind: Service
metadata:
  name: cross-network-gateway-istio
  namespace: istio-system
spec:
  # Map the gateway's external IP to the worker node's private IP address.
  # This resolves the <pending> LoadBalancer state and allows the control plane
  # to advertise a reachable private gateway endpoint to the VM sidecar.
  externalIPs:
  - 10.130.12.254 # Replace with your worker/gateway node private IP
